# CI + deploy: every push to main is typechecked, linted and built before
# wrangler ships it. A broken commit fails here instead of in production.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN — dash → My Profile → API Tokens → "Edit Cloudflare
#     Workers" template, plus D1:Edit (the migration step needs it).
#   CLOUDFLARE_ACCOUNT_ID — dash → Workers & Pages → Account ID.
# A missing secret fails the job on purpose: a green run that quietly shipped
# nothing is how production ends up several commits behind the branch.
#
# Order matters — migrations first, then the Worker. The new schema is
# backwards compatible with the code already running, but the new code is not
# compatible with the old schema, so a deploy that lands first serves 500s for
# the length of the migration.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            worker/package-lock.json

      # Fails before the build so a missing secret is reported in seconds
      # rather than after four minutes of checks.
      - name: Require deploy credentials
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing — see .github/workflows/deploy.yml"
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix worker

      - name: Typecheck app
        run: npm run typecheck --prefix app

      - name: Lint app
        run: npm run lint --prefix app

      - name: Typecheck worker
        run: npm run typecheck --prefix worker

      # An icon is never imported, so nothing here would ever fail on a broken
      # one: the favicon shipped as invalid XML (a "--" inside its comment, which
      # XML forbids) and browsers silently fell back to the PWA icon for weeks.
      # xmllint is not on the runner image (it used to be), so it is installed —
      # a real XML parser is the point, and this class of bug is exactly "the
      # file is not well-formed".
      - name: Validate icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --noout app/public/*.svg

      # wrangler deploy uploads ../app/dist as the assets directory, so the
      # SPA has to be built before it runs — this is what was stale in
      # production while the Worker code itself was current.
      - name: Build app
        run: npm run build --prefix app

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 migrations apply goodchat --remote

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy

      # Reads the deployed index.html and prints the hashed bundle it points
      # at, so the run log records exactly what is live. The URL is the
      # PUBLIC_ORIGIN var in wrangler.jsonc — the one origin the Worker serves
      # from — so a fork checks its own deployment without editing this file.
      #
      # Polled, not single-shot: `wrangler deploy` returns before the new
      # version has reached every colo, and the document is edge-cached
      # (max-age=0 + must-revalidate, so a colo revalidates against whichever
      # version it is already running). That window is seconds long, and a
      # one-shot read inside it fails a deploy that did land — which is worse
      # than no check, because the next person distrusts the red run.
      #
      # `no-cache` on the request and a unique query keep this off any cached
      # copy where the zone honours them; the poll is what covers the rest.
      - name: Verify deployment
        run: |
          expected=$(grep -o 'assets/index-[A-Za-z0-9_-]*\.js' app/dist/index.html | head -1)
          if [ -z "$expected" ]; then
            echo "::error::no hashed bundle in app/dist/index.html — did the build step run?"
            exit 1
          fi
          origin=$(grep -o '"PUBLIC_ORIGIN": *"[^"]*"' worker/wrangler.jsonc | sed 's/.*: *"\(.*\)"/\1/')
          if [ -z "$origin" ]; then
            echo "::error::no PUBLIC_ORIGIN in worker/wrangler.jsonc — nothing to verify against"
            exit 1
          fi
          for attempt in $(seq 1 10); do
            bundle=$(curl -fsS -H 'Cache-Control: no-cache' --retry 3 --retry-delay 5 \
              "${origin}/?deploy-check=${GITHUB_RUN_ID}-${attempt}" \
              | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' | head -1)
            echo "attempt ${attempt}: live bundle ${bundle:-<none>}, expected ${expected}"
            if [ "$bundle" = "$expected" ]; then
              echo "live bundle matches this build"
              exit 0
            fi
            sleep 10
          done
          echo "::error::live bundle still does not match this build after 10 attempts — deploy did not take effect"
          exit 1
