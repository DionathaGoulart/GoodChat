<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab icon only: a pixel "G" placeholder (public/favicon.svg). The PWA
         install icons stay on icon.svg / icon-*.png via the manifest. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      `viewport-fit=cover` so the page owns the whole screen on a notched phone
      (installed, the app is the only thing on it) — the insets are given back
      as env(safe-area-inset-*), which index.css spends on the thread's edges.
      `interactive-widget=resizes-content` makes the on-screen keyboard shrink
      the viewport instead of sliding it: the composer stays above the keys and
      `h-dvh` keeps meaning the visible height while typing.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      Literal hex (palettes.css §cream): meta/manifest can't read CSS vars. Only
      the pre-boot value — hooks/useTheme.ts rewrites it from the resolved
      theme's base-100, so it tracks whichever of the ten palettes is active.
      Deliberately not media-scoped: a media query would outrank the update.
    -->
    <meta name="theme-color" content="#f2efe7" />
    <title>GoodChat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
