<!-- GoodChat app icon — pixel speech bubble with terminal prompt, same
     pixel-art family as the sticker pack (cream plate, ink frame, crimson).
     Master for the PNG icons; regenerate with:
       magick public/icon.svg -resize 192x192 public/icon-192.png
       magick public/icon.svg -resize 512x512 public/icon-512.png
       magick -background "#f2efe7" public/icon.svg -resize 180x180 public/apple-touch-icon.png
       magick public/icon-maskable.svg -resize 512x512 public/icon-maskable-512.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" shape-rendering="crispEdges">
  <rect width="240" height="240" fill="#f2efe7"/>
  <g fill="#1a0a0a">
    <rect x="4" y="4" width="232" height="8"/>
    <rect x="4" y="228" width="232" height="8"/>
    <rect x="4" y="4" width="8" height="232"/>
    <rect x="228" y="4" width="8" height="232"/>
  </g>
  <g fill="#dc143c">
    <rect x="48" y="48" width="144" height="112"/>
    <rect x="32" y="64" width="16" height="80"/>
    <rect x="192" y="64" width="16" height="80"/>
    <rect x="64" y="160" width="32" height="16"/>
    <rect x="64" y="176" width="16" height="16"/>
  </g>
  <g fill="#f2efe7">
    <rect x="72" y="72" width="16" height="16"/>
    <rect x="88" y="88" width="16" height="16"/>
    <rect x="104" y="104" width="16" height="16"/>
    <rect x="88" y="120" width="16" height="16"/>
    <rect x="72" y="136" width="16" height="16"/>
    <rect x="128" y="120" width="48" height="16"/>
  </g>
</svg>
